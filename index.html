<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Gallery</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Image Gallery</h1>

    <!-- Gallery -->
    <div class="gallery">

        <div class="gallery-item">
            <img src="https://images.unsplash.com/11/sky-rose.jpg"
                 alt="Mountain"
                 onclick="openPopbox(0)">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1779781238799-7194caec2b28"
                 alt="Nature"
                 onclick="openPopbox(1)">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1789947998062-393d05531f04"
                 alt="Dog"
                 onclick="openPopbox(2)">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1790520850895-526d429f1093"
                 alt="Animal"
                 onclick="openPopbox(3)">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1787651501976-1692e5973ba3"
                 alt="Beach"
                 onclick="openPopbox(4)">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1789948731559-5d113d8744b6"
                 alt="Forest"
                 onclick="openPopbox(5)">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1789745261316-58a6192bae0f"
                 alt="Landscape"
                 onclick="openPopbox(6)">
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1787099812023-c9636ca620dc"
                 alt="Lake"
                 onclick="openPopbox(7)">
        </div>

    </div>


    <!-- Lightbox -->
    <div id="popbox" class="popbox">

        <button class="close" onclick="closeLPopbox()">
            &times;
        </button>

        <button class="prev" onclick="previousImage()">
            &#10094;
        </button>

        <img id="popupboxImage" src="" alt="Large Image">

        <button class="next" onclick="nextImage()">
            &#10095;
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
